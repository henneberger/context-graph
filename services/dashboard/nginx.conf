worker_processes auto;
events { worker_connections 2048; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 upstream query_api { server query:8081; }
 upstream ingest_api { server ingestion:8080; }
 upstream identity_api { server identity:8443; }
 limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
 proxy_ssl_trusted_certificate /etc/context-ca/ca.crt;
 proxy_ssl_verify on;
 proxy_ssl_server_name on;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws://localhost:18088; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  location = /health/live { access_log off; return 200 'ok'; }
  location /graphql { proxy_pass https://query_api; proxy_ssl_name query; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 75s; proxy_buffering off; }
  location /ingest/ { proxy_pass https://ingest_api; proxy_ssl_name ingestion; proxy_http_version 1.1; proxy_request_buffering off; proxy_buffering off; client_max_body_size 0; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
  location /media/ { proxy_pass https://ingest_api; proxy_ssl_name ingestion; proxy_buffering off; proxy_cache off; proxy_set_header Host $host; }
  location = /auth/token { limit_req zone=login burst=5 nodelay; client_max_body_size 4k; proxy_pass https://identity_api/token; proxy_ssl_name identity; proxy_buffering off; }
  location = /auth/session { proxy_pass https://ingest_api; proxy_ssl_name ingestion; proxy_buffering off; }
  location = /auth/logout { proxy_pass https://ingest_api; proxy_ssl_name ingestion; proxy_buffering off; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
