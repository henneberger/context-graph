worker_processes auto;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
 proxy_ssl_trusted_certificate /etc/context-ca/ca.crt;
 proxy_ssl_verify on;
 proxy_ssl_server_name on;
 server { listen 127.0.0.1:8082; location = /nginx_status { stub_status; } }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  location = /health/live { access_log off; return 200 'ok'; }
  location = /auth/token { limit_req zone=login burst=5 nodelay; client_max_body_size 4k; proxy_pass https://identity:8443/token; proxy_ssl_name identity; proxy_buffering off; }
  location = /api/ask { resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off; set $investigation_service investigation-api.context-graph.svc.cluster.local; client_max_body_size 8k; proxy_pass https://$investigation_service:8443; proxy_ssl_name search-api; proxy_read_timeout 240s; proxy_buffering off; }
  location = /api/investigate { resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off; set $investigation_service investigation-api.context-graph.svc.cluster.local; client_max_body_size 8k; proxy_pass https://$investigation_service:8443; proxy_ssl_name search-api; proxy_read_timeout 240s; proxy_buffering off; }
  location /api/ { client_max_body_size 8k; proxy_pass https://search-api:8443; proxy_ssl_name search-api; proxy_read_timeout 180s; proxy_buffering off; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
