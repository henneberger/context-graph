watchNamespaces:
- context-graph
webhook:
  create: false
operatorPod:
  labels:
    context-graph-control-plane: 'true'
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9405'
replicas: 2
strategy:
  type: RollingUpdate
defaultConfiguration:
  config.yaml: "kubernetes:\n  operator:\n    leader-election:\n      enabled: true\n\
    \      lease-name: context-graph-operator-leader\n\nkubernetes.operator.metrics.reporter.prom.factory.class:\
    \ org.apache.flink.metrics.prometheus.PrometheusReporterFactory\nkubernetes.operator.metrics.reporter.prom.port:\
    \ 9405\n"
jvmArgs:
  operator: -Xms128m -Xmx256m -XX:ActiveProcessorCount=2
metrics:
  port: 9405
