apiVersion: batch/v1
kind: Job
metadata: {name: secure-topics-v1, namespace: context-graph}
spec:
  backoffLimit: 8
  template:
    metadata: {labels: {app: security-provisioner}}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {fsGroup: 1000}
      containers:
        - name: topics
          image: apache/kafka:4.1.1
          command: [/bin/bash, -ec]
          args:
            - |
              K=/opt/kafka/bin
              for topic in events images video metrics nodes edges errors; do
                "$K/kafka-topics.sh" --bootstrap-server secure-kafka:9092 --command-config /app/secrets/kafka.properties --create --if-not-exists --topic "cg.secure.$topic" --partitions 6 --replication-factor 3 --config min.insync.replicas=2
              done
              acl() { "$K/kafka-acls.sh" --bootstrap-server secure-kafka:9092 --command-config /app/secrets/kafka.properties --add "$@"; }
              for topic in events images video; do
                acl --allow-principal User:ingestion --operation Write --operation Describe --topic "cg.secure.$topic"
                acl --allow-principal User:processor --operation Read --operation Describe --topic "cg.secure.$topic"
              done
              for topic in metrics nodes edges; do
                acl --allow-principal User:processor --operation Write --operation Describe --topic "cg.secure.$topic"
                acl --allow-principal User:query --operation Read --operation Describe --topic "cg.secure.$topic"
              done
              acl --allow-principal User:query --operation Read --operation Describe --topic cg.secure.video
              acl --allow-principal User:ingestion --allow-principal User:processor --operation Write --operation Describe --topic cg.secure.errors
              acl --allow-principal User:ingestion --operation IdempotentWrite --cluster
              acl --allow-principal User:processor --operation IdempotentWrite --cluster
              acl --allow-principal User:processor --operation Read --group context-secure- --resource-pattern-type prefixed
              acl --allow-principal User:processor --operation Write --operation Describe --transactional-id context-secure- --resource-pattern-type prefixed
              acl --allow-principal User:query --operation Read --group context-query- --resource-pattern-type prefixed
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 384Mi}}
          volumeMounts: [{name: security, mountPath: /app/secrets, readOnly: true}]
      volumes: [{name: security, secret: {secretName: security-admin, defaultMode: 288}}]
