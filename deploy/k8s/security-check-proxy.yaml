apiVersion: v1
kind: Service
metadata: {name: spicedb-checks, namespace: context-graph}
spec:
  selector: {app: spicedb-checks}
  ports: [{name: https, port: 8443}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: spicedb-checks, namespace: context-graph}
spec:
  replicas: 2
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: spicedb-checks}}
  template:
    metadata: {labels: {app: spicedb-checks}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: proxy
          image: context-graph/check-proxy:secure-v1
          imagePullPolicy: Never
          ports: [{containerPort: 8443}]
          env: [{name: SPICEDB_ENDPOINT, value: 'https://spicedb:8443'}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: '1', memory: 128Mi}}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /health/live, port: 8443}, periodSeconds: 5}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /health/live, port: 8443}, periodSeconds: 10}
          volumeMounts: [{name: secrets, mountPath: /run/check-proxy, readOnly: true}]
      volumes: [{name: secrets, secret: {secretName: check-proxy-security, defaultMode: 288}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: spicedb-checks, namespace: context-graph}
spec: {minAvailable: 1, selector: {matchLabels: {app: spicedb-checks}}}
