apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-runtime
  namespace: context-graph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-runtime
  namespace: context-graph
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-runtime
  namespace: context-graph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-runtime
subjects:
- kind: ServiceAccount
  name: flink-runtime
  namespace: context-graph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-secure-v1-jobmanager
  namespace: context-graph
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: context-secure-v1
      component: jobmanager
  template:
    metadata:
      labels:
        context-graph-role: processor
        context-graph-control-plane: 'true'
        app: context-secure-v1
        component: jobmanager
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9249'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsUser: 9999
        runAsGroup: 2000
        fsGroup: 2000
      terminationGracePeriodSeconds: 90
      containers:
      - name: flink
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: secure-kafka:9092
        - name: JOB_ID
          value: context-secure-v1
        - name: KAFKA_CLIENT_CONFIG
          value: /app/secrets/kafka.properties
        - name: CONFIG_PATH
          value: /app/config/jobs.yaml
        - name: WAREHOUSE_URI
          value: context
        - name: CHECKPOINT_URI
          value: s3://context-recovery/checkpoints
        - name: SAVEPOINT_URI
          value: s3://context-recovery/savepoints
        - name: POLARIS_URI
          value: https://polaris:8443/api/catalog
        - name: POLARIS_WAREHOUSE
          value: context
        - name: POLARIS_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: polaris-processor
              key: credential
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-recovery
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-recovery
              key: secret-key
        - name: AWS_REGION
          value: us-east-1
        - name: FLINK_PROPERTIES
          value: 'taskmanager.numberOfTaskSlots: 2

            jobmanager.memory.off-heap.size: 64m

            jobmanager.memory.jvm-overhead.min: 128m

            state.backend.type: rocksdb

            execution.checkpointing.incremental: true

            execution.checkpointing.interval: 10 s

            execution.checkpointing.min-pause: 5 s

            execution.checkpointing.max-concurrent-checkpoints: 1

            execution.checkpointing.timeout: 120 s

            execution.checkpointing.storage: filesystem

            execution.checkpointing.dir: s3://context-recovery/checkpoints

            execution.checkpointing.savepoint-dir: s3://context-recovery/savepoints

            execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

            high-availability.type: kubernetes

            high-availability.storageDir: s3://context-recovery/ha/context-secure-v1-native

            restart-strategy.type: exponential-delay

            rest.flamegraph.enabled: false

            s3.endpoint: https://object-storage:9000

            s3.path.style.access: true

            s3.connection.ssl.enabled: true

            metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory

            metrics.reporter.prom.port: 9249

            jobmanager.rpc.address: context-secure-v1

            rest.address: context-secure-v1-rest

            rest.bind-address: 0.0.0.0

            rest.port: 8081

            jobmanager.rpc.port: 6123

            blob.server.port: 6124

            taskmanager.rpc.port: 6122

            taskmanager.data.port: 6121

            jobmanager.memory.process.size: 768m

            taskmanager.memory.process.size: 1280m

            high-availability.cluster-id: context-schema-v2

            kubernetes.namespace: context-graph

            kubernetes.cluster-id: context-schema-v2'
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/app/secrets/kafka.truststore.p12
            -Djavax.net.ssl.trustStorePassword=changeit
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: kafka-credentials
          mountPath: /app/secrets
          readOnly: true
        ports:
        - containerPort: 9249
          name: metrics
        image: context-graph/processor:schema-v1
        args:
        - standalone-job
        - --job-classname
        - io.contextgraph.processor.SqlBundleJob
        - /app/config/jobs.yaml
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /overview
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: context-config
      - name: kafka-credentials
        secret:
          secretName: security-processor
          defaultMode: 288
      serviceAccountName: flink-runtime
---
