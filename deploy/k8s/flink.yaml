apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: context-secure-v1
  namespace: context-graph
spec:
  image: context-graph/processor:lakehouse-v3
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_3
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: '2'
    jobmanager.memory.off-heap.size: 64m
    jobmanager.memory.jvm-overhead.min: 128m
    kubernetes.jobmanager.cpu.limit-factor: '5.0'
    kubernetes.taskmanager.cpu.limit-factor: '4.0'
    state.backend.type: rocksdb
    execution.checkpointing.incremental: 'true'
    execution.checkpointing.interval: 10 s
    execution.checkpointing.min-pause: 5 s
    execution.checkpointing.max-concurrent-checkpoints: '1'
    execution.checkpointing.timeout: 120 s
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: s3://context-recovery/checkpoints
    execution.checkpointing.savepoint-dir: s3://context-recovery/savepoints
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    high-availability.type: kubernetes
    high-availability.storageDir: s3://context-recovery/ha/context-secure-v1
    restart-strategy.type: exponential-delay
    rest.flamegraph.enabled: 'false'
    kubernetes.operator.periodic.savepoint.interval: 1 h
    kubernetes.operator.savepoint.history.max.count: '5'
    kubernetes.operator.job.upgrade.last-state-fallback.enabled: 'false'
    env.java.opts.all: -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/app/secrets/kafka.truststore.p12
      -Djavax.net.ssl.trustStorePassword=changeit
    s3.endpoint: https://object-storage:9000
    s3.path.style.access: 'true'
    s3.connection.ssl.enabled: 'true'
    kubernetes.operator.job.restart.failed: 'true'
  jobManager:
    replicas: 2
    resources:
      requests:
        memory: 1280Mi
        cpu: '0.2'
  taskManager:
    replicas: 1
    resources:
      requests:
        memory: 1536Mi
        cpu: '0.5'
  podTemplate:
    metadata:
      labels:
        context-graph-role: processor
        context-graph-control-plane: 'true'
    spec:
      securityContext:
        runAsUser: 9999
        runAsGroup: 2000
        fsGroup: 2000
      terminationGracePeriodSeconds: 90
      containers:
      - name: flink-main-container
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: secure-kafka:9092
        - name: JOB_ID
          value: context-secure-v1
        - name: KAFKA_CLIENT_CONFIG
          value: /app/secrets/kafka.properties
        - name: CONFIG_PATH
          value: /app/config/jobs.yaml
        - name: WAREHOUSE_URI
          value: context
        - name: CHECKPOINT_URI
          value: s3://context-recovery/checkpoints
        - name: SAVEPOINT_URI
          value: s3://context-recovery/savepoints
        - name: POLARIS_URI
          value: https://polaris:8443/api/catalog
        - name: POLARIS_WAREHOUSE
          value: context
        - name: POLARIS_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: polaris-processor
              key: credential
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: object-storage-recovery
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-recovery
              key: secret-key
        - name: AWS_REGION
          value: us-east-1
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: kafka-credentials
          mountPath: /app/secrets
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: context-config
      - name: kafka-credentials
        secret:
          secretName: security-processor
          defaultMode: 288
  job:
    jarURI: local:///opt/flink/usrlib/processor.jar
    entryClass: io.contextgraph.processor.ContextGraphJob
    args:
    - /app/config/jobs.yaml
    parallelism: 2
    upgradeMode: savepoint
    state: running
    allowNonRestoredState: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-secure-jobmanager
  namespace: context-graph
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: context-secure-v1
      component: jobmanager
