          name: metrics
        image: context-graph/processor:schema-v1
        args:
        - taskmanager
        resources:
          requests:
            cpu: 100m
            memory: 1024Mi
          limits:
            memory: 1536Mi
      volumes:
      - name: config
        configMap:
          name: context-config
      - name: kafka-credentials
        secret:
          secretName: security-processor
          defaultMode: 288
      serviceAccountName: flink-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: context-secure-v1
  namespace: context-graph
spec:
  selector:
    app: context-secure-v1
    component: jobmanager
  ports:
  - name: rpc
    port: 6123
  - name: blob
    port: 6124
---
apiVersion: v1
kind: Service
metadata:
  name: context-secure-v1-rest
  namespace: context-graph
spec:
  selector:
    app: context-secure-v1
    component: jobmanager
  ports:
  - name: rest
    port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-flink-internal
  namespace: context-graph
spec:
  podSelector:
    matchLabels:
      app: context-secure-v1
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: context-secure-v1
    ports:
    - port: 6121
      protocol: TCP
    - port: 6122
      protocol: TCP
    - port: 6123
      protocol: TCP
    - port: 6124
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: context-secure-v1
    ports:
    - port: 6121
      protocol: TCP
    - port: 6122
      protocol: TCP
    - port: 6123
      protocol: TCP
    - port: 6124
      protocol: TCP
