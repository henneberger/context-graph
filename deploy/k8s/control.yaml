apiVersion: v1
kind: ServiceAccount
metadata:
  name: control
  namespace: context-graph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control
  namespace: context-graph
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
- apiGroups:
  - flink.apache.org
  resources:
  - flinkdeployments
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control
  namespace: context-graph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control
subjects:
- kind: ServiceAccount
  name: control
  namespace: context-graph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: context-graph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: control
        context-graph-role: control
        context-graph-control-plane: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9404'
    spec:
      containers:
      - name: control
        image: context-graph/control:search-v1
        ports:
        - containerPort: 8443
          name: https
        - containerPort: 9404
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        env:
        - name: SPICEDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: spicedb-client
              key: token
        volumeMounts:
        - name: tls
          mountPath: /run/control
          readOnly: true
        readinessProbe: &id001
          httpGet:
            path: /health/live
            port: 8443
            scheme: HTTPS
          periodSeconds: 5
        livenessProbe: *id001
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
      serviceAccountName: control
      volumes:
      - name: tls
        secret:
          secretName: control-security
---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: context-graph
spec:
  selector:
    app: control
  ports:
  - name: https
    port: 8443
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control
  namespace: context-graph
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: control
