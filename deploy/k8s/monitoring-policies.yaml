apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-access
  namespace: context-graph
spec:
  podSelector:
    matchLabels:
      app: control
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - dashboard
    ports:
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - identity
          - spicedb-checks
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - prometheus
    ports:
    - protocol: TCP
      port: 9090
---
