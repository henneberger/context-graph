apiVersion: batch/v1
kind: Job
metadata: {name: context-topics-v1, namespace: context-graph}
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.1.1
          command: [/bin/bash, -ec]
          args:
            - |
              for topic in cg.events cg.images cg.video cg.errors cg.metrics cg.nodes cg.edges; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$topic" --partitions 6 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000
              done
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 384Mi}}
