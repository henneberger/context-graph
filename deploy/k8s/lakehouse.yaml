apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-object-storage
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-role
      operator: In
      values:
      - object-storage
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - polaris
          - processor
          - ingestion
          - query
          - lakehouse-admin
    ports:
    - port: 9000
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-polaris
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-role
      operator: In
      values:
      - polaris
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - processor
          - query
          - lakehouse-admin
    ports:
    - port: 8443
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - object-storage
    ports:
    - port: 9000
  - to:
    - podSelector:
        matchLabels:
          app: spicedb-postgres
    ports:
    - port: 5432
---
apiVersion: networking.k8s.io/v1
