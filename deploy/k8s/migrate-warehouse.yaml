apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-warehouse-v1
  namespace: context-graph
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        context-graph-role: processor
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 9999
        runAsGroup: 2000
        fsGroup: 2000
      containers:
      - name: migration
        image: context-graph/processor:lakehouse-v3
        imagePullPolicy: Never
        command:
        - java
        - -cp
        - /opt/flink/usrlib/processor.jar:/opt/flink/lib/*
        - io.contextgraph.processor.MigrateWarehouse
        env:
        - name: MIGRATION_WRITER_SUSPENDED
          value: 'true'
        - name: POLARIS_URI
          value: https://polaris:8443/api/catalog
        - name: POLARIS_WAREHOUSE
          value: context
        - name: POLARIS_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: polaris-migration
              key: credential
        - name: JAVA_TOOL_OPTIONS
          value: -Xmx640m -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/app/secrets/kafka.truststore.p12
            -Djavax.net.ssl.trustStorePassword=changeit
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: source
          mountPath: /data/warehouse
          subPath: warehouse-secure
          readOnly: true
        - name: trust
          mountPath: /app/secrets
          readOnly: true
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: context-data
      - name: trust
        secret:
          secretName: security-processor
          defaultMode: 288
