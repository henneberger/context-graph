apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: context-graph
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
        context-graph-role: ingestion
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: ingestion
        image: context-graph/ingestion:lakehouse-v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: /app/config/ingestion.json
        - name: MEDIA_ROOT
          value: /data/media
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: secure-kafka:9092
        - name: KAFKA_CLIENT_CONFIG
          value: /app/secrets/kafka.properties
        - name: OIDC_ISSUER
          value: https://identity:8443
        - name: OIDC_AUDIENCE
          value: context-graph
        - name: OIDC_JWKS_URL
          value: https://identity:8443/.well-known/jwks.json
        - name: SPICEDB_ENDPOINT
          value: https://spicedb-checks:8443
        - name: TLS_KEYSTORE_PATH
          value: /app/secrets/server.p12
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/app/secrets/kafka.truststore.p12
            -Djavax.net.ssl.trustStorePassword=changeit
        - name: TLS_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: security-ingestion
              key: tls-password
        - name: SPICEDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: spicedb-client
              key: token
        - name: MEDIA_S3_ENDPOINT
          value: https://object-storage:9000
        - name: MEDIA_S3_BUCKET
          value: context-media
        - name: MEDIA_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-media
              key: access-key
        - name: MEDIA_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: object-storage-media
              key: secret-key
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTPS
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: HTTPS
          failureThreshold: 60
          periodSeconds: 2
          timeoutSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /data/media
        - name: credentials
          mountPath: /app/secrets
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
      volumes:
      - name: config
        configMap:
          name: context-config
      - name: data
        emptyDir:
          sizeLimit: 4Gi
      - name: credentials
        secret:
          secretName: security-ingestion
          defaultMode: 288
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 2000
        fsGroup: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: context-graph
spec:
  selector:
    app: ingestion
  ports:
  - name: http
    port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion
  namespace: context-graph
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingestion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  namespace: context-graph
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
        context-graph-role: query
    spec:
      terminationGracePeriodSeconds: 90
      containers:
      - name: query
        image: context-graph/query:lakehouse-v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: QUERY_CONFIG
          value: /app/config/query.yaml
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: secure-kafka:9092
        - name: KAFKA_CLIENT_CONFIG
          value: /app/secrets/kafka.properties
        - name: OIDC_ISSUER
          value: https://identity:8443
        - name: OIDC_AUDIENCE
          value: context-graph
        - name: OIDC_JWKS_URL
          value: https://identity:8443/.well-known/jwks.json
        - name: SPICEDB_ENDPOINT
          value: https://spicedb-checks:8443
        - name: TLS_KEYSTORE_PATH
          value: /app/secrets/server.p12
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/app/secrets/kafka.truststore.p12
            -Djavax.net.ssl.trustStorePassword=changeit
        - name: TLS_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: security-query
              key: tls-password
        - name: SPICEDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: spicedb-client
              key: token
        - name: POLARIS_URI
          value: https://polaris:8443/api/catalog
        - name: POLARIS_WAREHOUSE
          value: context
        - name: POLARIS_NAMESPACE
          value: context_secure
        - name: POLARIS_CA_FILE
          value: /run/catalog-ca/ca.crt
        - name: POLARIS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: polaris-query
              key: client-id
        - name: POLARIS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: polaris-query
              key: client-secret
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
            scheme: HTTPS
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health/live
            port: 8081
            scheme: HTTPS
          failureThreshold: 90
          periodSeconds: 2
          timeoutSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: cache
          mountPath: /tmp/duckdb-cache
        - name: credentials
          mountPath: /app/secrets
          readOnly: true
        - name: catalog-ca
          mountPath: /run/catalog-ca
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
      volumes:
      - name: config
        configMap:
          name: context-config
      - name: cache
        emptyDir:
          sizeLimit: 512Mi
      - name: credentials
        secret:
          secretName: security-query
          defaultMode: 288
      - name: catalog-ca
        configMap:
          name: security-public-ca
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10002
        runAsGroup: 2000
        fsGroup: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: query
  namespace: context-graph
spec:
  selector:
    app: query
  ports:
  - name: http
    port: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: query
  namespace: context-graph
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: query
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: context-graph
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        context-graph-role: dashboard
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: dashboard
        image: context-graph/dashboard:secure-v6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - nginx -s quit; sleep 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: ca
          mountPath: /etc/context-ca
          readOnly: true
      volumes:
      - name: ca
        configMap:
          name: security-public-ca
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: context-graph
spec:
  selector:
    app: dashboard
  ports:
  - name: http
    port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
  namespace: context-graph
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: dashboard
