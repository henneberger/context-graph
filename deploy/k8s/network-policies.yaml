apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: context-graph
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-egress
  namespace: context-graph
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-role
      operator: In
      values:
      - dashboard
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - ingestion
          - query
          - identity
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-role
      operator: In
      values:
      - ingestion
      - query
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - dashboard
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - secure-kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - spicedb-checks
          - identity
    ports:
    - protocol: TCP
      port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - identity
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - dashboard
          - ingestion
          - query
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - security-provisioner
    ports:
    - protocol: TCP
      port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - secure-kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - ingestion
          - query
          - processor
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - secure-kafka
          - security-provisioner
    ports:
    - protocol: TCP
      port: 9092
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - secure-kafka
    ports:
    - protocol: TCP
      port: 9093
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - secure-kafka
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
---
apiVersion: networking.k8s.io/v1
