apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provisioning-egress
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - security-provisioner
  policyTypes:
  - Egress
