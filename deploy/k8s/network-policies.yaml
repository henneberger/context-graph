metadata:
  name: operator-flink-egress
  namespace: context-graph
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flink-kubernetes-operator
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - processor
    ports:
    - protocol: TCP
      port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-api-egress
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-control-plane
      operator: In
      values:
      - 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 127.0.0.1/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: networking.k8s.io/v1
