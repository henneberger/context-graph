apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flink-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: context-graph-role
      operator: In
      values:
      - processor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - processor
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: flink-kubernetes-operator
    ports:
    - protocol: TCP
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - processor
    ports:
    - protocol: TCP
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - secure-kafka
    ports:
    - protocol: TCP
      port: 9092
---
apiVersion: networking.k8s.io/v1
