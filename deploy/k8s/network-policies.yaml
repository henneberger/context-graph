metadata:
  name: spicedb-access
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - spicedb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - spicedb-checks
          - security-provisioner
          - spicedb
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 50051
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - spicedb-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - spicedb
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 50051
