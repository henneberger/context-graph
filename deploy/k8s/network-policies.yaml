  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: context-graph-role
          operator: In
          values:
          - ingestion
          - query
    ports:
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: spicedb
