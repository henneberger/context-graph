apiVersion: v1
kind: Service
metadata: {name: kafka-headless, namespace: context-graph}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: context-graph}
spec:
  selector: {app: kafka}
  ports: [{name: client, port: 9092}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: context-graph}
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext: {fsGroup: 1000}
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          command: [/bin/bash, -ec]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.context-graph.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '0@kafka-0.kafka-headless:9093,1@kafka-1.kafka-headless:9093,2@kafka-2.kafka-headless:9093'}
            - {name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093'}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '3'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '3'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '2'}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: '3'}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: '2'}
            - {name: KAFKA_NUM_PARTITIONS, value: '6'}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'false'}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx384m'}
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            exec: {command: [/opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, 'localhost:9092']}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts: [{name: broker-data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: broker-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: kafka, namespace: context-graph}
spec: {minAvailable: 2, selector: {matchLabels: {app: kafka}}}
