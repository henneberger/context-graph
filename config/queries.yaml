registeredTables:
  context_secure.events:
    entityColumn: entity_id
  context_secure.images:
    entityColumn: entity_id
  context_secure.video:
    entityColumn: entity_id
  context_secure.slack:
    entityColumn: entity_id
  context_secure.github:
    entityColumn: entity_id
  context_secure.metrics:
    entityColumn: entity_id
types: 'scalar JSON

  scalar Long

  type Metric { entity_id: String! metric: String! window_start: String! window_end:
  String! sample_count: Long! sum_value: Float avg_value: Float min_value: Float max_value:
  Float }

  type MetricTotal { metric: String! sample_count: Long! sum_value: Float! }

  type Event { event_id: String! entity_id: String! endpoint: String kind: String
  event_time: String ingested_at: String payload: JSON }

  type VideoPayload { streamId: String! sequence: Int! uri: String! playlistUri: String!
  durationSeconds: Float! keyframeAligned: Boolean! }

  type VideoEvent { eventId: String! entityId: String! eventTime: String! payload:
  VideoPayload! }

  type SearchHit { bm25Score: Float recencyBoost: Float titleBoost: Float typeWeight:
  Float id: String! source: String! documentType: String! title: String! snippet:
  String! content: String! url: String! author: String! container: String! updatedAt:
  String! score: Float! revision: String! }


  type Record { event_id: String! entity_id: String! event_time: String metric: String
  value: JSON _json_remainder: JSON }

  '
queries:
  metricTotals:
    signature: 'metricTotals(metric: String!): [MetricTotal!]!'
    table: context_secure.metrics
    sql: SELECT metric, sum(sample_count) AS sample_count, sum(sum_value) AS sum_value
      FROM source WHERE metric = :metric GROUP BY metric
  metrics:
    signature: 'metrics(entityId: String, limit: Int = 100): [Metric!]!'
    table: context_secure.metrics
    sql: SELECT * FROM source WHERE (:entityId IS NULL OR entity_id = :entityId) ORDER
      BY window_end DESC LIMIT :limit
  search:
    signature: 'search(query: String!, source: String = "all", limit: Int = 10, sinceDays:
      Int = 0, sort: String = "relevance"): [SearchHit!]!'
    engine: bm25
    sql: SELECT * FROM slack UNION ALL SELECT * FROM github
    ranking:
      recencyWeight: 0.35
      titleBoost: 0.2
      halfLifeDays:
        document: 180
        message: 14
        pull_request: 45
        issue: 45
        commit: 90
      typeWeights:
        document: 1.3
        message: 1.0
        pull_request: 1.15
        issue: 1.1
        commit: 0.8
    sources:
      slack: context_secure.slack
      github: context_secure.github
  documents:
    signature: 'documents(ids: [String!]!): [SearchHit!]!'
    engine: documents
    sql: SELECT * FROM slack UNION ALL SELECT * FROM github
    sources:
      slack: context_secure.slack
      github: context_secure.github
  media:
    signature: 'media(entityId: String, limit: Int = 100): [Event!]!'
    sources:
      video: context_secure.video
    sql: "SELECT event_id, entity_id, event_time, 'video' AS kind,\n STRUCT_PACK(streamId\
      \ := streamId, sequence := sequence, uri := uri, playlistUri := playlistUri,\n\
      \ durationSeconds := durationSeconds, keyframeAligned := keyframeAligned) AS\
      \ payload\n FROM video WHERE (:entityId IS NULL OR entity_id=:entityId)\n ORDER\
      \ BY event_time DESC LIMIT :limit"
  records:
    signature: 'records(entityId: String, limit: Int = 100): [Record!]!'
    table: context_secure.events
    sql: SELECT event_id, entity_id, event_time, metric, value, _json_remainder FROM
      source WHERE (:entityId IS NULL OR entity_id=:entityId) ORDER BY event_time
      DESC LIMIT :limit
subscriptions:
  metricUpdated:
    signature: 'metricUpdated(entityId: String): Metric!'
    topics:
    - cg.secure.metrics
    entityField: entity_id
  videoChunk:
    signature: 'videoChunk(entityId: String): VideoEvent!'
    topics:
    - cg.secure.video
    entityField: entityId
